<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command palette</title>
<style>
  :root {
    --surface: hsl(220 18% 9%);
    --panel: hsl(222 16% 13%);
    --panel-top: hsl(222 16% 15%);
    --border: hsl(220 14% 22%);
    --border-soft: hsl(220 14% 18%);
    --hairline: hsl(220 14% 20%);
    --text: hsl(220 16% 94%);
    --text-dim: hsl(220 12% 62%);
    --text-faint: hsl(220 10% 46%);
    --accent: hsl(248 84% 70%);
    --accent-soft: hsl(248 70% 64%);
    --row-hover: hsl(220 16% 17%);
    --row-active: hsl(248 60% 22%);
    --kbd-bg: hsl(220 14% 19%);
    --kbd-border: hsl(220 14% 26%);
    --confirm: hsl(150 60% 56%);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, hsl(248 40% 14% / 0.55) 0%, transparent 55%),
      var(--surface);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100%;
    padding: 64px 24px 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    width: 100%;
    max-width: 432px;
  }

  .palette {
    background:
      linear-gradient(180deg, var(--panel-top), var(--panel));
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px hsl(220 18% 6% / 0.6),
      0 20px 50px -12px hsl(220 40% 2% / 0.7),
      0 8px 18px -8px hsl(220 40% 2% / 0.55),
      inset 0 1px 0 hsl(220 20% 100% / 0.05);
    overflow: hidden;
    transform-origin: top center;
    animation: rise 0.5s var(--ease) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(-10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .palette.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    height: 58px;
    border-bottom: 1px solid var(--hairline);
    position: relative;
  }

  .search .glass {
    flex-shrink: 0;
    color: var(--text-faint);
    display: flex;
    transition: color 0.25s var(--ease);
  }
  .search.focused .glass { color: var(--accent); }

  #q {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.1px;
    height: 100%;
  }
  #q::placeholder { color: var(--text-faint); }

  .esc {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-faint);
    border: 1px solid var(--kbd-border);
    background: var(--kbd-bg);
    border-radius: 6px;
    padding: 3px 7px;
    letter-spacing: 0.4px;
    font-family: inherit;
    user-select: none;
  }

  .list-wrap {
    padding: 8px;
    max-height: 372px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .list-wrap::-webkit-scrollbar { width: 8px; }
  .list-wrap::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .group-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 10px 12px 6px;
    user-select: none;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 0 12px;
    height: 46px;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    color: var(--text-dim);
    transition: color 0.15s var(--ease);
  }

  .row .bg {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--row-hover);
    opacity: 0;
    transform: scale(0.985);
    transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
    z-index: 0;
  }

  .row.active {
    color: var(--text);
  }
  .row.active .bg {
    opacity: 1;
    transform: scale(1);
    background:
      linear-gradient(180deg, hsl(220 16% 19%), hsl(220 16% 16%));
    box-shadow: inset 0 0 0 1px hsl(220 16% 28%);
  }

  .row .marker {
    position: absolute;
    left: 0;
    top: 50%;
    width: 3px;
    height: 0;
    border-radius: 3px;
    background: var(--accent);
    transform: translateY(-50%);
    transition: height 0.2s var(--ease);
    z-index: 1;
  }
  .row.active .marker { height: 20px; }

  .row .icon {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsl(220 14% 17%);
    border: 1px solid hsl(220 14% 23%);
    color: var(--text-dim);
    transition: background 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease), transform 0.18s var(--ease);
  }
  .row.active .icon {
    background: linear-gradient(180deg, hsl(248 44% 26%), hsl(248 44% 21%));
    border-color: hsl(248 50% 40%);
    color: hsl(248 90% 88%);
  }

  .row .label {
    position: relative;
    z-index: 1;
    flex: 1;
    font-size: 14.5px;
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .label .hit {
    color: var(--text);
    font-weight: 600;
  }
  .row.active .label .hit { color: hsl(248 90% 84%); }

  .row .sub {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-left: 6px;
    font-weight: 400;
  }

  .shortcut {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .shortcut kbd {
    font-family: inherit;
    font-size: 11px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    background: var(--kbd-bg);
    border: 1px solid var(--kbd-border);
    border-bottom-width: 2px;
    border-radius: 5px;
    letter-spacing: 0.3px;
  }
  .row.active .shortcut kbd {
    color: var(--text);
    background: hsl(220 14% 22%);
    border-color: hsl(220 14% 32%);
  }

  .row.run .bg {
    background: hsl(150 50% 20%) !important;
    box-shadow: inset 0 0 0 1px hsl(150 50% 36%) !important;
  }
  .row.run .icon {
    background: linear-gradient(180deg, hsl(150 50% 30%), hsl(150 50% 24%)) !important;
    border-color: hsl(150 50% 42%) !important;
    color: hsl(150 80% 86%) !important;
    transform: scale(1.05);
  }
  .row.run .marker { background: var(--confirm) !important; }

  .empty {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 40px 20px 44px;
    color: var(--text-faint);
    text-align: center;
  }
  .empty.show { display: flex; }
  .empty .e-icon {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: hsl(220 14% 16%);
    border: 1px solid hsl(220 14% 22%);
  }
  .empty p { font-size: 13.5px; }
  .empty b { color: var(--text-dim); font-weight: 600; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    border-top: 1px solid var(--hairline);
    font-size: 11.5px;
    color: var(--text-faint);
    background: hsl(220 16% 11%);
  }
  .footer .hints { display: flex; gap: 14px; }
  .footer .hint { display: flex; align-items: center; gap: 6px; }
  .footer kbd {
    font-family: inherit;
    font-size: 10px;
    min-width: 16px;
    height: 16px;
    padding: 0 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    background: var(--kbd-bg);
    border: 1px solid var(--kbd-border);
    border-radius: 4px;
  }
  .footer .brand { display: flex; align-items: center; gap: 6px; opacity: 0.8; }
  .footer .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 28px);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px 9px 12px;
    background: hsl(150 30% 14%);
    border: 1px solid hsl(150 40% 30%);
    border-radius: 11px;
    box-shadow: 0 10px 30px -8px hsl(150 50% 4% / 0.7);
    color: hsl(150 70% 86%);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--ease), transform 0.4s var(--ease);
    white-space: nowrap;
    z-index: 5;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -14px);
  }
  .toast .check {
    display: flex;
    width: 20px; height: 20px;
    align-items: center; justify-content: center;
    border-radius: 50%;
    background: hsl(150 50% 26%);
    color: hsl(150 80% 88%);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.01s !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="palette" id="palette">
      <div class="search" id="search">
        <span class="glass" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </span>
        <input id="q" type="text" placeholder="Search commands…" autocomplete="off" spellcheck="false" aria-label="Search commands" />
        <span class="esc">ESC</span>
      </div>

      <div class="list-wrap" id="listWrap" role="listbox" aria-label="Commands">
        <div class="group-label" id="groupLabel">Suggestions</div>
        <div id="list"></div>
        <div class="empty" id="empty">
          <span class="e-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path><path d="M8 11h6"></path></svg>
          </span>
          <p>No commands for "<b id="emptyTerm"></b>"</p>
        </div>
      </div>

      <div class="footer">
        <div class="hints">
          <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span class="hint"><kbd>↵</kbd> select</span>
        </div>
        <div class="brand"><span class="dot"></span>Command menu</div>
      </div>

      <div class="toast" id="toast">
        <span class="check" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <span id="toastMsg">Done</span>
      </div>
    </div>
  </div>

<script>
(function () {
  const icons = {
    file: '<path d="M14 3v5h5"/><path d="M18 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2Z"/>',
    branch: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="8" r="3"/><path d="M18 11a6 6 0 0 1-6 6H6"/><path d="M6 9v6"/>',
    theme: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    invite: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M18 8v6M21 11h-6"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
    deploy: '<path d="M12 2C7 6 7 12 7 12l5 3 5-3s0-6-5-10Z"/><circle cx="12" cy="9" r="1.6"/><path d="M9 18c-1.5 1-2 4-2 4s3-.5 4-2"/><path d="M15 18c1.5 1 2 4 2 4s-3-.5-4-2"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'
  };

  const commands = [
    { id: 'newfile',  label: 'New file',          sub: 'Create a blank document', icon: 'file',     keys: ['⌘', 'N'], toast: 'New file created' },
    { id: 'branch',   label: 'Switch branch',     sub: 'main · 3 ahead',          icon: 'branch',   keys: ['⌘', 'B'], toast: 'Branch switcher opened' },
    { id: 'theme',    label: 'Toggle theme',      sub: 'Light / dark',            icon: 'theme',    keys: ['⌘', '⇧', 'L'], toast: 'Theme toggled' },
    { id: 'invite',   label: 'Invite teammates',  sub: 'Share workspace access',  icon: 'invite',   keys: ['⌘', 'I'], toast: 'Invite dialog opened' },
    { id: 'settings', label: 'Open settings',     sub: 'Preferences & account',   icon: 'settings', keys: ['⌘', ','], toast: 'Settings opened' },
    { id: 'deploy',   label: 'Deploy to production', sub: 'Push live build',      icon: 'deploy',   keys: ['⌘', '⇧', 'D'], toast: 'Deploy started' },
    { id: 'copy',     label: 'Copy current URL',  sub: 'To clipboard',            icon: 'copy',     keys: ['⌘', 'C'], toast: 'URL copied' },
    { id: 'trash',    label: 'Move to trash',     sub: 'Delete this item',        icon: 'trash',    keys: ['⌫'],      toast: 'Moved to trash' }
  ];

  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const listWrap = document.getElementById('listWrap');
  const search = document.getElementById('search');
  const palette = document.getElementById('palette');
  const empty = document.getElementById('empty');
  const emptyTerm = document.getElementById('emptyTerm');
  const groupLabel = document.getElementById('groupLabel');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');

  let filtered = [];
  let active = 0;
  let toastTimer = null;

  function svg(name) {
    return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (icons[name] || '') + '</svg>';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function highlight(label, term) {
    if (!term) return escapeHtml(label);
    const i = label.toLowerCase().indexOf(term.toLowerCase());
    if (i === -1) return escapeHtml(label);
    return escapeHtml(label.slice(0, i)) +
      '<span class="hit">' + escapeHtml(label.slice(i, i + term.length)) + '</span>' +
      escapeHtml(label.slice(i + term.length));
  }

  function render() {
    const term = q.value.trim();
    filtered = commands.filter(c =>
      c.label.toLowerCase().includes(term.toLowerCase()) ||
      c.sub.toLowerCase().includes(term.toLowerCase())
    );

    if (active >= filtered.length) active = Math.max(0, filtered.length - 1);

    if (filtered.length === 0) {
      list.innerHTML = '';
      groupLabel.style.display = 'none';
      emptyTerm.textContent = term;
      empty.classList.add('show');
      return;
    }

    empty.classList.remove('show');
    groupLabel.style.display = '';
    groupLabel.textContent = term ? 'Results' : 'Suggestions';

    list.innerHTML = filtered.map((c, idx) => {
      const keys = c.keys.map(k => '<kbd>' + escapeHtml(k) + '</kbd>').join('');
      return (
        '<div class="row' + (idx === active ? ' active' : '') + '" role="option" data-idx="' + idx + '" aria-selected="' + (idx === active) + '">' +
          '<span class="bg"></span>' +
          '<span class="marker"></span>' +
          '<span class="icon">' + svg(c.icon) + '</span>' +
          '<span class="label">' + highlight(c.label, term) + '<span class="sub">' + escapeHtml(c.sub) + '</span></span>' +
          '<span class="shortcut">' + keys + '</span>' +
        '</div>'
      );
    }).join('');

    Array.from(list.children).forEach(el => {
      el.addEventListener('mousemove', () => setActive(+el.dataset.idx));
      el.addEventListener('click', () => run(+el.dataset.idx));
    });
  }

  function setActive(idx) {
    if (idx === active) return;
    active = idx;
    Array.from(list.children).forEach((el, i) => {
      el.classList.toggle('active', i === active);
      el.setAttribute('aria-selected', i === active);
    });
    scrollToActive();
  }

  function move(delta) {
    if (!filtered.length) return;
    active = (active + delta + filtered.length) % filtered.length;
    Array.from(list.children).forEach((el, i) => {
      el.classList.toggle('active', i === active);
      el.setAttribute('aria-selected', i === active);
    });
    scrollToActive();
  }

  function scrollToActive() {
    const el = list.children[active];
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function run(idx) {
    if (idx == null) idx = active;
    const cmd = filtered[idx];
    if (!cmd) {
      palette.classList.remove('shake');
      void palette.offsetWidth;
      palette.classList.add('shake');
      return;
    }
    const el = list.children[idx];
    if (el) {
      el.classList.add('run');
      setTimeout(() => el && el.classList.remove('run'), 360);
    }
    showToast(cmd.toast);
  }

  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
  }

  q.addEventListener('input', () => { active = 0; render(); });

  q.addEventListener('focus', () => search.classList.add('focused'));
  q.addEventListener('blur', () => search.classList.remove('focused'));

  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') {
      if (q.value) { q.value = ''; active = 0; render(); }
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      q.focus();
      q.select();
    }
  });

  render();
  search.classList.add('focused');
  setTimeout(() => q.focus(), 80);
})();
</script>
</body>
</html>
